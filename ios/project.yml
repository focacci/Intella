name: Intella
options:
  bundleIdPrefix: com.michaelfocacci
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: "7R3SX9X3V2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES

targets:
  # ---------- iOS app ----------
  Intella:
    type: application
    platform: iOS
    sources:
      - path: Intella
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelfocacci.intella
        PRODUCT_NAME: Intella
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    dependencies:
      - target: IntellaWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

  # ---------- watchOS app ----------
  IntellaWatch:
    type: application
    platform: watchOS
    sources:
      - path: IntellaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelfocacci.intella.watchkitapp
        PRODUCT_NAME: Intella
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.michaelfocacci.intella
        INFOPLIST_KEY_CFBundleDisplayName: Intella
    dependencies:
      - target: IntellaWatchWidget
        embed: true

  # ---------- watchOS widget extension ----------
  IntellaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: IntellaWatchWidget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelfocacci.intella.watchkitapp.widget
        PRODUCT_NAME: IntellaWatchWidget
    info:
      path: IntellaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Intella
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
